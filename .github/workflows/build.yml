name: "Build"
on:
  push:
    # Only run on branches
    branches:
    - '**'

jobs:

  linux:
    runs-on: ubuntu-22.04
    steps:
    - name: "Install dependencies"
      run: |
        sudo apt update -y
        sudo apt install -y libsdl2-dev libsdl2-image-dev

    - name: "Checkout sources"
      uses: actions/checkout@v3

    - name: "Compile"
      run: |
        make bin/brogue

    - name: "Create artifact"
      run: |
        make BrogueCE-linux
        tar -czvf BrogueCE-linux-x86_64.tar.gz BrogueCE-linux

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: BrogueCE-linux-x86_64.tar.gz
        compression-level: 0  # There's no point compressing something already compressed

  macos-intel:
    runs-on: macos-15-intel
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v3

    - name: "Prepare"
      run: |
        make macos/sdl3.rb macos/sdl2-compat.rb

    - name: "Cache SDL"
      uses: actions/cache@v3
      with:
        path: |
          sdl3-cellar
          sdl2-compat-cellar
        key: sdl-macos-x86_64-${{hashFiles('macos/sdl3.rb', 'macos/sdl2-compat.rb')}}

    - name: "Compile and install dependencies"
      run: |
        # SDL3 and sdl2-compat are built from formulae pinned in make/releases.mk (HOMEBREW_CORE_COMMIT).
        # The local tap is always set up, so Homebrew can find the formulae of the installed (or cached) kegs.
        tap_dir="$(brew --repository local/broguece)"
        mkdir -p "$tap_dir/Formula"
        cp macos/sdl3.rb macos/sdl2-compat.rb "$tap_dir/Formula"
        if [ -d sdl3-cellar ] && [ -d sdl2-compat-cellar ]; then
          cp -r sdl3-cellar $(brew --cellar)/sdl3
          cp -r sdl2-compat-cellar $(brew --cellar)/sdl2-compat
          brew link sdl3 sdl2-compat
        else
          brew install --build-from-source local/broguece/sdl3
          brew install --build-from-source local/broguece/sdl2-compat
          cp -r $(brew --cellar)/sdl3 sdl3-cellar
          cp -r $(brew --cellar)/sdl2-compat sdl2-compat-cellar
        fi
        brew install sdl2_image dylibbundler
        brew list --versions sdl3 sdl2-compat sdl2_image

    - name: "Compile"
      run: |
        make MAC_APP=YES Brogue.app
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.7"

    - name: "Fix and bundle dylib references"
      # libSDL3 is not actually a link dependency of sdl2-compat, so we need to copy it in and run dylibbundler on it.
      run: |
        cd Brogue.app/Contents
        cp "$(brew --cellar)"/sdl3/*/lib/libSDL3.dylib MacOS/libSDL3.dylib
        dylibbundler -cd -b -x MacOS/brogue -x MacOS/libSDL3.dylib

    - name: "Create artifact"
      run: |
        make BrogueCE-macos
        zip -rll BrogueCE-macos-x86_64.zip BrogueCE-macos

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: macos-x86_64
        path: BrogueCE-macos-x86_64.zip
        compression-level: 0  # There's no point compressing something already compressed

  macos-arm:
    runs-on: macos-15
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v3

    - name: "Prepare"
      run: |
        make macos/sdl3.rb macos/sdl2-compat.rb

    - name: "Cache SDL"
      uses: actions/cache@v3
      with:
        path: |
          sdl3-cellar
          sdl2-compat-cellar
        key: sdl-macos-arm64-${{hashFiles('macos/sdl3.rb', 'macos/sdl2-compat.rb')}}

    - name: "Compile and install dependencies"
      run: |
        # SDL3 and sdl2-compat are built from formulae pinned in make/releases.mk (HOMEBREW_CORE_COMMIT).
        # The local tap is always set up, so Homebrew can find the formulae of the installed (or cached) kegs.
        tap_dir="$(brew --repository local/broguece)"
        mkdir -p "$tap_dir/Formula"
        cp macos/sdl3.rb macos/sdl2-compat.rb "$tap_dir/Formula"
        if [ -d sdl3-cellar ] && [ -d sdl2-compat-cellar ]; then
          cp -r sdl3-cellar $(brew --cellar)/sdl3
          cp -r sdl2-compat-cellar $(brew --cellar)/sdl2-compat
          brew link sdl3 sdl2-compat
        else
          brew install --build-from-source local/broguece/sdl3
          brew install --build-from-source local/broguece/sdl2-compat
          cp -r $(brew --cellar)/sdl3 sdl3-cellar
          cp -r $(brew --cellar)/sdl2-compat sdl2-compat-cellar
        fi
        brew install sdl2_image dylibbundler
        brew list --versions sdl3 sdl2-compat sdl2_image

    - name: "Compile"
      run: |
        make MAC_APP=YES Brogue.app
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.7"

    - name: "Fix and bundle dylib references"
      # libSDL3 is not actually a link dependency of sdl2-compat, so we need to copy it in and run dylibbundler on it.
      run: |
        cd Brogue.app/Contents
        cp "$(brew --cellar)"/sdl3/*/lib/libSDL3.dylib MacOS/libSDL3.dylib
        dylibbundler -cd -b -x MacOS/brogue -x MacOS/libSDL3.dylib

    - name: "Create artifact"
      run: |
        make BrogueCE-macos
        zip -rll BrogueCE-macos-arm64.zip BrogueCE-macos

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        path: BrogueCE-macos-arm64.zip
        compression-level: 0  # There's no point compressing something already compressed

  windows:
    runs-on: windows-latest
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v3

    - name: "Install dependencies"
      run: |
        .\.github\get-deps-mingw.ps1

    - name: "Compile"
      shell: powershell
      run: |
        $env:path = $env:path + ";" + (Join-Path $pwd.Drive.Root "opt/local/x86_64-w64-mingw32/bin")
        mingw32-make SDL_CONFIG='sdl2-config --prefix=/opt/local/x86_64-w64-mingw32' SYSTEM=WINDOWS CC=gcc bin/brogue.exe

    - name: "Create artifact"
      run: |
        mingw32-make SYSTEM=WINDOWS BrogueCE-windows
        cp SDL2\x86_64-w64-mingw32\bin\SDL2.dll BrogueCE-windows
        cp SDL2_image\x86_64-w64-mingw32\bin\SDL2_image.dll BrogueCE-windows
        7z a BrogueCE-windows-x86_64.zip BrogueCE-windows

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: windows-x86_64
        path: BrogueCE-windows-x86_64.zip
        compression-level: 0  # There's no point compressing something already compressed
