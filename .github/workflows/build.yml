name: "Build"
on:
  push:
    # Only run on branches
    branches:
    - '**'

jobs:

  macos-intel:
    runs-on: macos-15-intel
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v3

    - name: "Prepare"
      run: |
        make macos/sdl3.rb

    - name: "Cache SDL"
      uses: actions/cache@v3
      with:
        path: sdl3-cellar
        key: sdl3-macos-x86_64-${{hashFiles('macos/sdl3.rb')}}

    - name: "Compile and install dependencies"
      run: |
        if [ -d sdl3-cellar ]; then
          cp -r sdl3-cellar $(brew --cellar)/sdl3
          brew link sdl3
        else
          tap_dir="$(brew --repository local/broguece)"
          mkdir -p "$tap_dir/Formula"
          cp macos/sdl3.rb "$tap_dir/Formula"
          brew install --build-from-source local/broguece/sdl3
          cp -r $(brew --cellar)/sdl3 sdl3-cellar
        fi
        brew install sdl2-compat sdl2_image dylibbundler

    - name: "Compile"
      run: |
        make MAC_APP=YES Brogue.app
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.7"

    - name: "Fix and bundle dylib references"
      run: |
        cd Brogue.app/Contents && dylibbundler -cd -b -x MacOS/brogue -x "$(brew --cellar)"/sdl3/*/lib/libSDL3.dylib

    - name: "Create artifact"
      run: |
        make BrogueCE-macos
        zip -rll BrogueCE-macos-x86_64.zip BrogueCE-macos

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: macos-x86_64
        path: BrogueCE-macos-x86_64.zip
        compression-level: 0  # There's no point compressing something already compressed

  macos-arm:
    runs-on: macos-15
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v3

    - name: "Prepare"
      run: |
        make macos/sdl3.rb

    - name: "Cache SDL"
      uses: actions/cache@v3
      with:
        path: sdl3-cellar
        key: sdl3-macos-arm64-${{hashFiles('macos/sdl3.rb')}}

    - name: "Compile and install dependencies"
      run: |
        if [ -d sdl3-cellar ]; then
          cp -r sdl3-cellar $(brew --cellar)/sdl3
          brew link sdl3
        else
          tap_dir="$(brew --repository local/broguece)"
          mkdir -p "$tap_dir/Formula"
          cp macos/sdl3.rb "$tap_dir/Formula"
          brew install --build-from-source local/broguece/sdl3
          cp -r $(brew --cellar)/sdl3 sdl3-cellar
        fi
        brew install sdl2-compat sdl2_image dylibbundler

    - name: "Compile"
      run: |
        make MAC_APP=YES Brogue.app
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.7"

    - name: "Fix and bundle dylib references"
      run: |
        cd Brogue.app/Contents && dylibbundler -cd -b -x MacOS/brogue -x "$(brew --cellar)"/sdl3/*/lib/libSDL3.dylib

    - name: "Create artifact"
      run: |
        make BrogueCE-macos
        zip -rll BrogueCE-macos-arm64.zip BrogueCE-macos

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        path: BrogueCE-macos-arm64.zip
        compression-level: 0  # There's no point compressing something already compressed
